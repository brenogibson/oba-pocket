; Oba Pocket — firmware para o M5Stack Core2 for AWS (EduKit)
[platformio]
default_envs = core2foraws

[env:core2foraws]
platform = espressif32
board = m5stack-core2
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 921600
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; sem multiply-add fundido: a mesma conta dá o mesmo pixel em qualquer lugar do código
    -ffp-contract=off
lib_deps =
    m5stack/M5Unified@^0.2.2
    adafruit/Adafruit NeoPixel@^1.12.3
    links2004/WebSockets@^2.6.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Firmware dev: o mesmo, com os comandos seriais de teste que fazem o papel do
; dono ou do microfone ('R', 'T', 'X', 'Y'/'N', 'E'; ver src/main.cpp).
;   pio run -e dev -t upload
[env:dev]
extends = env:core2foraws
build_flags =
    ${env:core2foraws.build_flags}
    -DOBA_SERIAL_DEBUG
