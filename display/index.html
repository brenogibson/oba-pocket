<!doctype html>
<!--
  Tela separada do Oba Pocket: legendas ao vivo, as regras que o agente deixou
  armadas na placa, as sugestões que o Oba mostrou e o resumo quando o REC
  desliga. O nome, as cores e o desenho vêm do Oba ativo (ui/oba).

  Só lê <prefixo>/<placa>/# no AWS IoT Core, com uma identidade não autenticada
  do Cognito cuja role não pode publicar nada (docs/protocol.md). A configuração
  vem do config.js, que o setup.py gera.

  Rodar:  cd display && python3 -m http.server 8080  ->  http://localhost:8080
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Oba Pocket · ao vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" id="favicon" href="data:,">
<style>
  :root { --bg: #0d1a22; --panel: #142a38; --accent: #5db8f5; --accent2: #3a8fd0; --soft: #eaf6ff; --muted: #9fbdd1; --rec: #ff3b4e; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 440px; grid-template-rows: auto minmax(0, 1fr); gap: 24px; padding: 28px;
         background: radial-gradient(circle at 20% 0%, var(--panel) 0%, var(--bg) 60%); color: var(--soft);
         font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; transition: background .6s; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  #avatar { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; }
  #avatar svg { width: 38px; height: 38px; }
  #avatar canvas { image-rendering: pixelated; }
  header h1 { font-size: 24px; margin: 0; font-weight: 650; }
  #status { margin-left: auto; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #status i { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  #status.live i { background: var(--rec); animation: pulse 1.2s infinite; }
  #status.paused i { background: transparent; border: 2px solid var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  #counter { font-size: 14px; color: var(--muted); }
  #counter:empty { display: none; }
  #counter b { color: #fff; font-size: 18px; }

  #transcript { background: var(--panel); border-radius: 18px; padding: 24px 28px; overflow: hidden;
                display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; }
  #transcript p { margin: 0 0 12px; font-size: 26px; line-height: 1.4; }
  #transcript p.partial { color: var(--muted); }
  #transcript mark { background: var(--accent); color: #fff; border-radius: 6px; padding: 0 6px; }
  #transcript .empty { color: var(--muted); font-size: 20px; }

  #cards { display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-height: 0; }
  .card { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 18px; padding: 20px 22px;
          box-shadow: 0 10px 30px #0006; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
  .card small { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }
  .card h2 { margin: 4px 0 8px; font-size: 24px; color: #fff; }
  .card p { margin: 0; color: #fff; opacity: .92; }
  .card footer { margin-top: 10px; font-size: 12px; opacity: .75; }
  .card.old { opacity: .45; transform: scale(.97); transition: all .4s; }
  .card .row { display: flex; gap: 16px; align-items: center; }
  .card .row > div:first-child { flex: 1; min-width: 0; }
  .card .icon { width: 72px; height: 72px; border-radius: 14px; background: #fff; padding: 6px; flex: none; }
  .card .qr { width: 104px; height: 104px; background: #fff; border-radius: 10px; padding: 6px; flex: none; }
  .card .qr svg { width: 100%; height: 100%; display: block; }
  .card a { color: #fff; }
  @keyframes pop { from { transform: translateX(60px) scale(.9); opacity: 0; } }

  #thinking { display: none; align-items: center; gap: 10px; color: var(--soft); font-size: 15px;
              background: var(--panel); border-radius: 999px; padding: 8px 16px; align-self: flex-start; }
  #thinking.on { display: flex; }
  #thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: dot 1.2s infinite; }
  #thinking i:nth-child(2) { animation-delay: .2s; } #thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 50% { transform: translateY(-5px); opacity: .4; } }

  #hand { background: var(--panel); border-radius: 18px; padding: 14px 18px; flex: none; }
  #hand h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #hand .empty { color: var(--muted); font-size: 14px; }
  .armed { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid #ffffff12;
           animation: pop .4s ease-out; }
  .armed:first-of-type { border-top: 0; }
  .armed img { width: 28px; height: 28px; border-radius: 6px; background: #fff; padding: 2px; flex: none; }
  .armed b { display: block; font-size: 15px; font-weight: 600; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #ffffff14; color: var(--soft); }
  .armed.fired { animation: fire .9s ease-in forwards; }
  .armed.fired .chip.hit { background: var(--accent); color: #fff; }
  @keyframes fire { 30% { transform: scale(1.04); background: #ffffff22; } to { opacity: 0; transform: translateX(40px); } }

  #summary { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 93%, transparent); display: none;
             place-items: center; z-index: 9; backdrop-filter: blur(6px); }
  #summary.on { display: grid; animation: fade .4s; }
  @keyframes fade { from { opacity: 0; } }
  #summary article { width: min(1100px, 92vw); max-height: 88vh; overflow: auto; background: var(--panel);
                     border-radius: 24px; padding: 36px 44px; box-shadow: 0 20px 60px #000a; }
  #summary small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
  #summary h2 { margin: 6px 0 14px; font-size: 34px; color: #fff; }
  #summary .text { font-size: 21px; margin: 0 0 22px; }
  #summary .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  #summary h4 { margin: 0 0 6px; color: var(--accent); font-size: 15px; text-transform: uppercase; letter-spacing: .06em; }
  #summary ul { margin: 0; padding-left: 20px; font-size: 17px; }
  #summary a { color: var(--soft); }
  #summary .close { float: right; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div id="avatar"></div>
  <h1 id="title">Oba Pocket · ao vivo</h1>
  <span id="counter"></span>
  <span id="status"><i></i><span id="statusText">conectando…</span></span>
</header>
<section id="transcript"><p class="empty">Aguardando a placa começar a ouvir…</p></section>
<aside id="cards">
  <div id="thinking"><i></i><i></i><i></i><span id="thinkingText"></span></div>
  <section id="hand"><h3>Armado na placa</h3><div id="handList"><p class="empty">Nada armado ainda</p></div></section>
</aside>
<div id="summary"><article></article></div>

<script src="config.js"></script>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const CFG = window.OBA_CONFIG || {};
const BASE = `${CFG.prefix}/${CFG.device}/`;   // docs/protocol.md
const KIND_LABEL = { service: 'Serviço AWS', blog: 'Blog AWS', doc: 'Documentação', demo: 'Demo', tip: 'Dica' };

// ------------------------------------------------------------ SigV4 (Web Crypto)
const te = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const sha256 = async s => hex(await crypto.subtle.digest('SHA-256', te.encode(s)));
async function hmac(key, msg) {
  const k = await crypto.subtle.importKey('raw', typeof key === 'string' ? te.encode(key) : key,
                                          { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return crypto.subtle.sign('HMAC', k, te.encode(msg));
}

async function cognito(target, body) {
  const r = await fetch(`https://cognito-identity.${CFG.region}.amazonaws.com/`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-amz-json-1.1', 'X-Amz-Target': `AWSCognitoIdentityService.${target}` },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || r.status);
  return j;
}

async function signedUrl() {
  const key = 'obaIdentity:' + CFG.identityPool;
  let id = localStorage.getItem(key);
  if (!id) {
    id = (await cognito('GetId', { IdentityPoolId: CFG.identityPool })).IdentityId;
    localStorage.setItem(key, id);
  }
  const c = (await cognito('GetCredentialsForIdentity', { IdentityId: id })).Credentials;
  const now = new Date().toISOString().replace(/[-:]|\.\d{3}/g, ''), date = now.slice(0, 8);
  const scope = `${date}/${CFG.region}/iotdevicegateway/aws4_request`;
  const qs = `X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=${encodeURIComponent(c.AccessKeyId + '/' + scope)}` +
             `&X-Amz-Date=${now}&X-Amz-SignedHeaders=host`;
  const canonical = `GET\n/mqtt\n${qs}\nhost:${CFG.iotEndpoint}\n\nhost\n${await sha256('')}`;
  let k = await hmac('AWS4' + c.SecretKey, date);
  for (const part of [CFG.region, 'iotdevicegateway', 'aws4_request']) k = await hmac(k, part);
  const sig = hex(await hmac(k, `AWS4-HMAC-SHA256\n${now}\n${scope}\n${await sha256(canonical)}`));
  // No IoT o token entra depois da assinatura
  return `wss://${CFG.iotEndpoint}/mqtt?${qs}&X-Amz-Signature=${sig}&X-Amz-Security-Token=${encodeURIComponent(c.SessionToken)}`;
}

// ------------------------------------------------------------ o Oba ativo (ui/oba)
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let oba = { name: 'Oba', wake_words: [] };
let wakeRe = null;

// Cor da paleta escurecida para o fundo e os painéis
function shade(color, k) {
  const n = parseInt(color.slice(1), 16);
  return '#' + [16, 8, 0].map(s => Math.round(((n >> s) & 255) * k).toString(16).padStart(2, '0')).join('');
}

function obaSvg(o) {
  const p = o.palette, e = o.eyes, pts = o.outline;
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
  const m = Math.max(w, h) * 0.06, side = Math.max(w, h) + 2 * m;
  const eye = x => `<ellipse cx="${x}" cy="${e.y}" rx="${e.rx || 8}" ry="${e.ry || 12}" fill="${p.eye}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0 + w / 2 - side / 2} ${y0 + h / 2 - side / 2} ${side} ${side}">` +
    `<polygon points="${pts.map(q => q.join(',')).join(' ')}" fill="${p.body}"/>${eye(e.left)}${eye(e.right)}</svg>`;
}

// Oba em sprites: anima a folha idle (tira horizontal de quadros, docs/oba.md) num canvas
let spriteTimer = null, avatarGen = 0;
function spriteAvatar(o) {
  const sp = o.sprites, gen = avatarGen, [w, h] = sp.size || [];
  const fps = Math.min(30, Math.max(1, Number(sp.fps) || 6));
  if (!(w > 0 && h > 0)) return;
  const img = new Image();
  img.onload = () => {
    if (gen !== avatarGen) return;   // chegou outro ui/oba enquanto carregava
    const n = Math.max(1, Math.floor(img.width / w)), fit = Math.max(w, h);
    const k = fit <= 40 ? Math.floor(40 / fit) : 40 / fit;   // escala inteira quando cabe
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.style.width = `${w * k}px`; c.style.height = `${h * k}px`;
    const g = c.getContext('2d'), t0 = performance.now();
    let last = -1;
    const draw = () => {
      const f = Math.floor((performance.now() - t0) * fps / 1000) % n;
      if (f === last) return;
      last = f;
      g.clearRect(0, 0, w, h);
      g.drawImage(img, f * w, 0, w, h, 0, 0, w, h);
    };
    $('avatar').replaceChildren(c);
    draw();
    if (n > 1) spriteTimer = setInterval(draw, 500 / fps);
    // Favicon: o primeiro quadro sobre o fundo da paleta
    const ic = document.createElement('canvas'), q = fit <= 56 ? Math.floor(56 / fit) : 56 / fit;
    ic.width = ic.height = 64;
    const x = ic.getContext('2d');
    x.fillStyle = (o.palette || {}).bg || '#000000';
    x.beginPath();
    if (x.roundRect) x.roundRect(0, 0, 64, 64, 14); else x.rect(0, 0, 64, 64);
    x.fill();
    x.imageSmoothingEnabled = false;
    x.drawImage(img, 0, 0, w, h, (64 - w * q) / 2, (64 - h * q) / 2, w * q, h * q);
    $('favicon').href = ic.toDataURL('image/png');
  };
  img.src = 'data:image/png;base64,' + sp.sheet;
}

function setOba(o) {
  oba = o;
  document.title = `${o.name} · ao vivo`;
  $('title').textContent = `${o.name} · ao vivo`;
  const words = (o.wake_words || []).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  wakeRe = words.length ? new RegExp(`\\b(${words.join('|')})\\b`, 'gi') : null;
  renderCounter();
  const s = document.documentElement.style;
  if (o.palette) {
    const p = o.palette;
    s.setProperty('--accent', p.bg);
    s.setProperty('--accent2', p.shadow);
    s.setProperty('--soft', p.text);
    s.setProperty('--muted', p.off || p.text);
    s.setProperty('--bg', shade(p.bg, 0.14));
    s.setProperty('--panel', shade(p.bg, 0.24));
  } else {                          // sem paleta: as cores do CSS
    for (const k of ['--accent', '--accent2', '--soft', '--muted', '--bg', '--panel']) s.removeProperty(k);
  }
  clearInterval(spriteTimer);
  spriteTimer = null;
  avatarGen++;
  if (o.sprites && o.sprites.sheet) {
    spriteAvatar(o);
  } else if (o.outline && o.eyes && o.palette) {
    const svg = obaSvg(o);
    $('avatar').innerHTML = svg;
    const icon = svg.replace('<svg ', `<svg style="background:${o.palette.bg};border-radius:22%" `);
    $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(icon);
  } else {                          // folha grande demais ou Oba fora do registro: só a cor
    $('avatar').replaceChildren();
    $('favicon').href = 'data:,';
  }
  renderTranscript();
}

// ------------------------------------------------------------ legendas
const lines = [];           // frases finais
let partial = null;         // {id, text}
let hits = 0;
let rec = null;             // do state retido (null = ainda não sabemos)
let online = null;

const highlight = s => wakeRe ? esc(s).replace(wakeRe, m => `<mark>${m}</mark>`) : esc(s);

function renderTranscript() {
  const html = lines.slice(-8).map(t => `<p>${highlight(t)}</p>`);
  if (partial) html.push(`<p class="partial">${highlight(partial.text)}</p>`);
  if (html.length) $('transcript').innerHTML = html.join('');
  else $('transcript').innerHTML = `<p class="empty">${rec ? 'Ouvindo…' : `Ligue o REC no ${esc(oba.name)} para começar`}</p>`;
}

function onTranscript(m) {
  if (m.partial) {
    partial = { id: m.id, text: m.text || '' };
  } else {
    if (m.text) lines.push(m.text);
    if (partial && partial.id === m.id) partial = null;
  }
  renderTranscript();
}

function renderCounter() {
  const w = (oba.wake_words || [])[0];
  $('counter').innerHTML = w ? `“${esc(oba.name)}” citado <b>${hits}</b>×` : '';
}

// ------------------------------------------------------------ comandos do agente (cmd)
// Os mesmos que a placa recebe; "card" é só para as telas
const hand = new Map();     // id da regra -> {card, bubble, words, expires, el}

const speakIn = c => (c.do || []).find(d => d.type === 'speak');
const iconImg = b => b && b.png ? `<img class="icon" src="data:image/png;base64,${b.png}" alt="">` : '';
function qrSvg(url) {
  const q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function showCard(card, b, heard) {
  card = card || {}; b = b || {};
  if (card.kind === 'summary' || (!card.title && !b.text)) return;  // o resumo tem a tela própria
  const url = card.url || b.url;
  const side = b.kind === 'qr' && url ? `<div class="qr">${qrSvg(url)}</div>` : iconImg(b);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<small>${esc(KIND_LABEL[card.kind] || oba.name)}</small>` +
    `<div class="row"><div><h2>${esc(card.title || '')}</h2><p>${esc(card.body || b.text || '')}</p></div>${side}</div>` +
    `<footer>${heard ? `lembrei quando ouvi “${esc(heard)}”` : 'direto da conversa'}` +
    `${card.source ? ` · fonte: ${esc(card.source)}` : ''}</footer>`;
  document.querySelectorAll('.card').forEach(x => x.classList.add('old'));
  $('hand').after(el);
  const all = document.querySelectorAll('.card');
  for (let i = 3; i < all.length; i++) all[i].remove();
}

function renderHandEmpty() {
  const empty = $('handList').querySelector('.empty');
  if (hand.size && empty) empty.remove();
  if (!hand.size && !empty) $('handList').innerHTML = '<p class="empty">Nada armado ainda</p>';
}

function arm(c) {
  disarm(c.id);
  const b = (speakIn(c) || {}).bubble || {};
  const chips = c.words && c.words.length ? c.words : [c.on || 'speech'];
  const el = document.createElement('div');
  el.className = 'armed';
  el.innerHTML = `${b.png ? `<img src="data:image/png;base64,${b.png}" alt="">` : ''}` +
    `<div><b>${esc((c.card && c.card.title) || b.text || c.on)}</b>` +
    `<div class="chips">${chips.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>`;
  $('handList').append(el);
  hand.set(c.id, { card: c.card, bubble: b, expires: Date.now() + (c.ttl_s || 900) * 1000, el });
  renderHandEmpty();
}

function disarm(id, fired) {
  const h = hand.get(id);
  if (!h) return;
  hand.delete(id);
  if (fired) {
    h.el.querySelectorAll('.chip').forEach(x => x.classList.toggle('hit', x.textContent === fired));
    h.el.classList.add('fired');
    setTimeout(() => { h.el.remove(); renderHandEmpty(); }, 900);
  } else {
    h.el.remove();
    renderHandEmpty();
  }
}

function clearAll() {
  [...hand.keys()].forEach(id => disarm(id));
  document.querySelectorAll('.card').forEach(x => x.remove());
  thinking(false);
}

function onCommand(m) {
  switch (m.type) {
    case 'speak': showCard(m.card, m.bubble); break;
    case 'arm': arm(m); break;
    case 'disarm': disarm(m.id); break;
    case 'reset':               // session nova = começou uma reunião; null = acabou
      clearAll();
      if (m.session) { lines.length = 0; partial = null; hits = 0; renderCounter(); renderTranscript(); hideSummary(); }
      break;
  }
}
setInterval(() => { for (const [id, h] of hand) if (Date.now() > h.expires) disarm(id); }, 5000);

function onEvent(m) {
  if (m.type === 'wake') { hits++; renderCounter(); }
  else if (m.type === 'rule.fired') {
    const h = hand.get(m.id);
    if (!h) return;
    disarm(m.id, m.trigger);
    showCard(h.card, h.bubble, m.text && m.text.length < 90 ? m.text : m.trigger);
  }
}

function thinking(on, run) {
  $('thinking').classList.toggle('on', !!on);
  $('thinkingText').textContent = run === 'summary' ? `${oba.name} escrevendo o resumo…` : `${oba.name} pensando…`;
}

// ------------------------------------------------------------ resumo (ui/summary, retido)
const list = (title, items) => items && items.length
  ? `<div><h4>${esc(title)}</h4><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
const host = u => { try { return new URL(u).hostname; } catch { return ''; } };

function showSummary(s) {
  const sugg = (s.suggestions || []).map(x => `${esc(x.title)}` +
    (x.url && host(x.url) ? ` — <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(host(x.url))}</a>` : ''));
  $('summary').querySelector('article').innerHTML =
    `<span class="close">toque para fechar</span>` +
    `<small>Resumo da conversa · ${s.lines || 0} frases · ${new Date(s.ts || Date.now()).toLocaleTimeString('pt-BR')}</small>` +
    `<h2>${esc(s.title || 'Resumo')}</h2><p class="text">${esc(s.summary || '')}</p>` +
    `<div class="cols">${list('Assuntos', (s.topics || []).map(esc))}${list('Decisões', (s.decisions || []).map(esc))}` +
    `${list('Próximos passos', (s.next_steps || []).map(esc))}${list(`Sugestões do ${oba.name}`, sugg)}</div>`;
  $('summary').classList.add('on');
}
function hideSummary() { $('summary').classList.remove('on'); }
$('summary').onclick = hideSummary;

function setStatus(live, text) {
  $('status').classList.toggle('live', live);
  $('status').classList.toggle('paused', rec === false);
  $('statusText').textContent = text;
}

// ------------------------------------------------------------ MQTT
function onMessage(topic, payload) {
  const ch = topic.slice(BASE.length);
  if (!payload.length) {      // retido apagado
    if (ch === 'ui/summary') hideSummary();
    return;
  }
  let m;
  try { m = JSON.parse(payload.toString()); } catch { return; }
  if (m.v !== 1) return;
  switch (ch) {
    case 'state':
      online = m.online !== false;
      if (online) { rec = !!m.rec; if (!rec) { partial = null; renderTranscript(); } }
      break;
    case 'transcript': lastMsg = Date.now(); onTranscript(m); break;
    case 'evt': onEvent(m); break;
    case 'cmd': onCommand(m); break;
    case 'ui/oba': setOba(m); break;
    case 'ui/think': thinking(m.state === 'start', m.run); break;
    case 'ui/summary': showSummary(m); break;
  }
}

const CHANNELS = ['state', 'transcript', 'evt', 'cmd', 'ui/oba', 'ui/think', 'ui/summary'];
let lastMsg = 0;
async function connect() {
  if (!CFG.identityPool || !CFG.iotEndpoint) { setStatus(false, 'falta o display/config.js: rode o setup.py'); return; }
  setStatus(false, 'conectando…');
  try {
    const client = mqtt.connect(await signedUrl(), {
      clientId: `${CFG.prefix}-display-` + Math.random().toString(16).slice(2, 10),
      protocolVersion: 4, reconnectPeriod: 0, keepalive: 30,
    });
    const watchdog = setInterval(() => {
      if (!client.connected) return;
      const fresh = Date.now() - lastMsg < 5000;
      if (online === false) setStatus(false, 'placa desconectada');
      else if (rec === false) setStatus(false, 'REC desligado na placa');
      else setStatus(fresh, fresh ? 'ao vivo' : 'conectado, sem áudio da placa');
    }, 1000);
    // Tópicos exatos: o IoT Core não entrega as mensagens retidas (state, ui/oba, ui/summary)
    // numa assinatura com curinga
    client.on('connect', () => { setStatus(false, 'conectado'); client.subscribe(CHANNELS.map(c => BASE + c)); });
    client.on('message', onMessage);
    // Credenciais do Cognito duram ~1h: ao cair, reconecta com uma URL nova
    client.on('close', () => { clearInterval(watchdog); client.end(true); setStatus(false, 'reconectando…'); setTimeout(connect, 2000); });
    client.on('error', e => console.warn('mqtt', e.message));
  } catch (e) {
    console.error(e);
    setStatus(false, 'erro: ' + e.message);
    setTimeout(connect, 5000);
  }
}
thinking(false);
renderTranscript();
connect();
</script>
